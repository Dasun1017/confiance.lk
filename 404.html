<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>404 | Page Not Found | CONFIANCE</title>
    <style>
        * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #eff7ff; color: #19384a; font-family: Arial, sans-serif; line-height: 1.6; }
        main { width: 100%; max-width: 620px; text-align: center; padding: clamp(24px, 6vw, 56px); border-radius: 18px; background: #fff; box-shadow: 0 12px 40px rgb(18 88 117 / 10%); } .brand { color: #125875; font-size: 20px; font-weight: 800; letter-spacing: 3px; text-decoration: none; }
        .code { font-size: clamp(64px, 16vw, 110px); font-weight: 800; line-height: 1.1; margin: 24px 0 8px; color: #e63946; } h1 { font-size: clamp(24px, 5vw, 32px); line-height: 1.25; } p { color: #526775; } .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 28px; }
        .actions a, button { font: inherit; cursor: pointer; border: 1px solid #125875; border-radius: 8px; padding: 12px 20px; text-decoration: none; color: #125875; background: #fff; } .actions .primary { background: #125875; color: #fff; } a:focus-visible, button:focus-visible { outline: 3px solid #e63946; outline-offset: 4px; }
    </style>
</head>
<body>
    <main>
        <a class="brand" href="/">CONFIANCE</a>
        <div class="code" aria-hidden="true">404</div>
        <h1>Page not found</h1>
        <p>The page may have moved, or the address may be incorrect. You can return to our homepage or contact our team.</p>
        <div class="actions">
            <a class="primary" href="/">Go to homepage</a>
            <a href="/contact.html">Contact us</a>
        </div>
    </main>
</body>
</html>
