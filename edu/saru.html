<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Header Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        header {
            background-color: #000;
            color: #fff;
            font-size: 14px;
        }
        header a {
            text-decoration: none;
            color: #fff;
            transition: color 0.2s ease-in-out;
        }
        header a:hover {
            color: #ffc107; /* Optional hover effect */
        }
        .form-check-input {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header class="py-2">
        <div class="container d-flex justify-content-between align-items-center">
            <!-- Contact Information -->
            <div class="d-flex align-items-center">
                <span class="me-2">Call: +94 70 473 2867</span>
            </div>
            <!-- Social Links -->
            <div class="d-flex align-items-center">
                <span class="me-2">Follow us:</span>
                <a href="#" class="text-white me-2"><i class="fab fa-facebook"></i></a>
                <a href="#" class="text-white"><i class="fab fa-tiktok"></i></a>
            </div>
            <!-- Light Mode Toggle and Links -->
            <div class="d-flex align-items-center">
                <div class="form-check form-switch me-3">
                    <input class="form-check-input" type="checkbox" id="lightModeToggle">
                    <label class="form-check-label" for="lightModeToggle">Light Mode</label>
                </div>
                <a href="#" class="text-white me-3"><i class="fas fa-sign-in-alt"></i> Login</a>
                <a href="#" class="text-white"><i class="fas fa-user-plus"></i> Register</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="py-5">
        <div class="container text-center">
            <h1>Welcome to the Page</h1>
            <p>This is a simple example demonstrating a Bootstrap header with icons and toggles.</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
